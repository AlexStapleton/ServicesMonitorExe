name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a release with this tag (e.g. v1.1.0) on the selected branch. Leave empty to just build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            make

      - name: Build
        run: make

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServicesExeMonitor
          path: ServicesExeMonitor.exe
          if-no-files-found: error

      - name: Attach .exe to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ServicesExeMonitor.exe
          generate_release_notes: true

      # Manual release: Actions > Build > Run workflow, with release_tag set.
      # Creates the tag at the built commit and the release with the .exe.
      # (A tag created by GITHUB_TOKEN does not start another run, so this
      # doesn't build twice.)
      - name: Validate release tag
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release_tag must look like v1.2.3 (got: $TAG)" >&2
            exit 1
          fi

      - name: Create release from manual run
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: ServicesExeMonitor.exe
          generate_release_notes: true
